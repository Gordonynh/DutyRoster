entranceAssembly: ClassIsland.DutyRoster.dll
name: 值日提醒
id: gordon.dutyroster
description: 到点主动弹出值日安排，人名用大字显示，超时自动关闭。日常时间点用卡片，大扫除整屏提醒。值日表为纯文本，一行一个时间点。
version: 1.1.0.0
apiVersion: 2.0.0.0
author: GordonYoung
icon: icon.png
url: https://github.com/Gordonynh/DutyRoster
readme: README.md
# 只在 Windows 上声明。浮窗的置顶重申（TopmostEnforcer）和「点屏幕任意位置关闭」
# （GlobalClickWatcher）都直接调用 user32.dll，别的平台跑不起来——
# 声明成支持反而是对用户撒谎，安装时会收到不该有的兼容性保证。
supportedOSPlatforms:
  - Windows
